[package]
name = "dumpster_bench"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
authors = ["Clayton Ramsey"]
description = "Benchmark for dumpster garbage collection crate"
repository = "https://github.com/claytonwramsey/dumpster"
readme = "../README.md"
keywords = ["dumpster", "garbage_collector", "benchmark"]
categories = ["data-structures", "memory-management"]
publish = false

[dependencies]
dumpster = { path = "../dumpster", features = ["derive"] }
dumpster_foldhash_fast = { package = "dumpster", git = "https://github.com/bluurryy/dumpster", branch = "foldhash-fast" }
dumpster_foldhash_fast_fixed = { package = "dumpster", git = "https://github.com/bluurryy/dumpster", branch = "foldhash-fast-fixed" }
dumpster_foldhash_quality = { package = "dumpster", git = "https://github.com/bluurryy/dumpster", branch = "foldhash-quality" }
dumpster_foldhash_quality_fixed = { package = "dumpster", git = "https://github.com/bluurryy/dumpster", branch = "foldhash-quality-fixed" }
fastrand = "2.0.0"
parking_lot = "0.12.3"
